name: Android/iOS CI

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_task: assembleRelease
          - os: macos-latest
            build_task: iosSimulatorArm64Binaries
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: "recursive"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Build and publish mimi.client.kotlin locally
        if: steps.m2-cache.outputs.cache-hit != 'true'
        working-directory: library/mimi.kotlin
        shell: bash
        run: |
          touch github.properties local.properties

          list=(
              ":engine:core"
              ":engine:ktor"
              ":engine:okhttp"
              ":service:token"
              ":service:asr-core"
              ":service:asr"
              ":service:nict-asr"
              ":service:nict-tts"
              ":utils"
          )
          for task in "${list[@]}"; do
              # publishToMavenLocal を実行
              ./gradlew "$task":publishToMavenLocal

              if [ $? -ne 0 ]; then
                  echo "エラー: $task の実行に失敗しました"
                  exit 1
              fi

              echo "完了: $task"
              echo "------------------------"
          done

      - name: Create secrets.properties
        run: |
          echo "mimiApplicationId=dummy" >> secrets.properties
          echo "mimiClientId=dummy" >> secrets.properties
          echo "mimiClientSecret=dummy" >> secrets.properties
          echo "geminiApiKey=dummy" >> secrets.properties
          echo "geminiEndpoint=https://generativelanguage.googleapis.com/" >> secrets.properties
          echo "geminiModel=gemini-2.5-flash" >> secrets.properties

      - name: Run ${{ matrix.build_task }}
        env:
          GRADLE_OPTS: ${{ startsWith(matrix.os, 'macos') && '-Xmx8g' || '' }}
        run: ./gradlew ${{ matrix.build_task }}
